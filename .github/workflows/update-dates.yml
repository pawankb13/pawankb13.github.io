# Sets each session's "updated" date in lms/courses.json from the last commit
# that touched the session's folder. Runs after every push that changes lms/content/.
# The script is lms/tools/set_dates.py. You can also run this by hand from the Actions tab.
name: Update session dates

on:
  push:
    branches: [master]
    paths: ["lms/content/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dates
  cancel-in-progress: false

jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so git log can find each folder's last commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set dates from git history
        run: python lms/tools/set_dates.py

      - name: Commit courses.json if it changed
        run: |
          if git diff --quiet -- lms/courses.json; then
            echo "Dates already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add lms/courses.json
          git commit -m "Update session dates"
          git pull --rebase origin master
          git push origin HEAD:master
