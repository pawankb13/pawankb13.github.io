<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="Arial, sans-serif">
<defs><marker id="m555c61" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555c61"/></marker><marker id="mc0504d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs>
<rect width="800" height="620" fill="#fff"/>
<!-- axes: output axis sits above the bottom so saving can be negative at low income -->
<line x1="130" y1="30" x2="130" y2="580" stroke="#555c61" stroke-width="4"/><line x1="130" y1="400" x2="750" y2="400" stroke="#555c61" stroke-width="4"/>
<text x="440" y="612" font-size="28" fill="#555c61" text-anchor="middle">Income, output, Y</text>
<text x="40" y="230" font-size="28" fill="#555c61" text-anchor="middle" transform="rotate(-90 40 230)">Saving, investment (I, S)</text>
<text x="118" y="432" font-size="28" font-weight="700" fill="#2f3437" text-anchor="end">0</text>
<!-- investment, autonomous -->
<line x1="130" y1="260" x2="720" y2="260" stroke="#b5852a" stroke-width="8" stroke-linecap="round"/>
<text x="732" y="270" font-size="30" font-weight="700" fill="#b5852a" text-anchor="start">I = <tspan text-decoration="overline">I</tspan></text>
<!-- S1: original saving schedule -->
<line x1="130" y1="540" x2="720" y2="188.5" stroke="#3d8296" stroke-width="8" stroke-linecap="round"/>
<text x="732" y="198" font-size="34" font-weight="700" fill="#3d8296" text-anchor="start">S₁</text>
<!-- S2: people save more at every income -->
<line x1="130" y1="470" x2="720" y2="118.5" stroke="#c0504d" stroke-width="8" stroke-linecap="round"/>
<text x="732" y="128" font-size="34" font-weight="700" fill="#c0504d" text-anchor="start">S₂</text>
<!-- shift arrow S1 -> S2 -->
<line x1="672" y1="212" x2="672" y2="158" stroke="#555c61" stroke-width="5" marker-end="url(#m555c61)"/>
<!-- equilibria -->
<line x1="600" y1="260" x2="600" y2="400" stroke="#555c61" stroke-width="2.5" stroke-dasharray="8 7"/>
<line x1="482.5" y1="260" x2="482.5" y2="400" stroke="#555c61" stroke-width="2.5" stroke-dasharray="8 7"/>
<circle cx="600" cy="260" r="12" fill="#3d8296" stroke="#fff" stroke-width="3"/>
<circle cx="482.5" cy="260" r="12" fill="#c0504d" stroke="#fff" stroke-width="3"/>
<text x="600" y="438" font-size="32" font-weight="700" fill="#3d8296" text-anchor="middle">Y₁</text>
<text x="482.5" y="438" font-size="32" font-weight="700" fill="#c0504d" text-anchor="middle">Y₂</text>
<!-- output falls -->
<line x1="585" y1="474" x2="500" y2="474" stroke="#c0504d" stroke-width="6" marker-end="url(#mc0504d)"/>
</svg>
