<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" font-family="Arial, sans-serif">
<defs><marker id="m555c61" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555c61"/></marker><marker id="mc0504d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker><marker id="mb5852a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5852a"/></marker><marker id="m3a8a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a3a"/></marker></defs>
<rect width="860" height="640" fill="#fff"/>
<!-- axes -->
<line x1="210" y1="40" x2="210" y2="540" stroke="#555c61" stroke-width="4"/><line x1="210" y1="540" x2="820" y2="540" stroke="#555c61" stroke-width="4"/>
<text x="515" y="624" font-size="28" fill="#555c61" text-anchor="middle">Income, output, Y</text>
<text x="34" y="210" font-size="28" fill="#555c61" text-anchor="middle" transform="rotate(-90 34 210)">Aggregate demand, AD</text>
<text x="198" y="572" font-size="28" font-weight="700" fill="#2f3437" text-anchor="end">0</text>
<!-- 45 degree line -->
<line x1="210" y1="540" x2="700" y2="50" stroke="#9aa0a4" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round"/>
<text x="712" y="58" font-size="28" fill="#555c61" text-anchor="start">AD = Y</text>
<path d="M280,540 A70,70 0 0 0 259.5,490.5" fill="none" stroke="#555c61" stroke-width="2.5"/>
<text x="290" y="512" font-size="24" fill="#555c61" text-anchor="start">45°</text>
<!-- consumption line: intercept C - c(TA - TR) -->
<line x1="210" y1="460" x2="780" y2="289" stroke="#3d8296" stroke-width="8" stroke-linecap="round"/>
<text x="845" y="420" font-size="24" font-weight="700" fill="#3d8296" text-anchor="end">C = [<tspan text-decoration="overline">C</tspan> − c(<tspan text-decoration="overline">TA</tspan> − <tspan text-decoration="overline">TR</tspan>)] + cY</text>
<text x="198" y="468" font-size="24" font-weight="700" fill="#3d8296" text-anchor="end"><tspan text-decoration="overline">C</tspan> − c(<tspan text-decoration="overline">TA</tspan> − <tspan text-decoration="overline">TR</tspan>)</text>
<!-- aggregate demand line: intercept A -->
<line x1="210" y1="300" x2="780" y2="129" stroke="#c0504d" stroke-width="8" stroke-linecap="round"/>
<text x="845" y="218" font-size="30" font-weight="700" fill="#c0504d" text-anchor="end">AD = <tspan text-decoration="overline">A</tspan> + cY</text>
<text x="198" y="311" font-size="30" font-weight="700" fill="#c0504d" text-anchor="end"><tspan text-decoration="overline">A</tspan></text>
<!-- I + G + NX gap between AD and C -->
<line x1="620" y1="185" x2="620" y2="329" stroke="#b5852a" stroke-width="5" marker-start="url(#mb5852a)" marker-end="url(#mb5852a)"/>
<text x="634" y="268" font-size="26" font-weight="700" fill="#b5852a" text-anchor="start"><tspan text-decoration="overline">I</tspan> + <tspan text-decoration="overline">G</tspan> + <tspan text-decoration="overline">NX</tspan></text>
<!-- equilibrium -->
<line x1="552.9" y1="197.1" x2="552.9" y2="540" stroke="#555c61" stroke-width="2.5" stroke-dasharray="8 7"/>
<line x1="210" y1="197.1" x2="552.9" y2="197.1" stroke="#555c61" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="198" y="207" font-size="28" font-weight="700" fill="#2f3437" text-anchor="end">AD₀</text>
<text x="552.9" y="576" font-size="30" font-weight="700" fill="#2f3437" text-anchor="middle">Y₀</text>
<circle cx="552.9" cy="197.1" r="12" fill="#2f3437" stroke="#fff" stroke-width="3"/>
<text x="540" y="176" font-size="34" font-weight="700" fill="#2f3437" text-anchor="end">E</text>
<!-- IU < 0 (below Y0): AD above 45 line -->
<line x1="400" y1="251" x2="400" y2="342" stroke="#3a8a3a" stroke-width="5" marker-start="url(#m3a8a3a)" marker-end="url(#m3a8a3a)"/>
<text x="388" y="306" font-size="28" font-weight="700" fill="#3a8a3a" text-anchor="end">IU &lt; 0</text>
<!-- IU > 0 (above Y0): AD below 45 line -->
<line x1="700" y1="58" x2="700" y2="145" stroke="#c0504d" stroke-width="5" marker-start="url(#mc0504d)" marker-end="url(#mc0504d)"/>
<text x="714" y="112" font-size="28" font-weight="700" fill="#c0504d" text-anchor="start">IU &gt; 0</text>
<!-- adjustment arrows along the output axis -->
<line x1="430" y1="516" x2="520" y2="516" stroke="#3a8a3a" stroke-width="5" marker-end="url(#m3a8a3a)"/>
<line x1="680" y1="516" x2="586" y2="516" stroke="#c0504d" stroke-width="5" marker-end="url(#mc0504d)"/>
</svg>
