<line x1="80" y1="275.0" x2="450" y2="275.0" stroke="#c0504d" stroke-width="6"/><text x="450" y="263.0" font-size="26" font-weight="700" fill="#c0504d" text-anchor="end">SRAS</text>
<circle cx="265.0" cy="275.0" r="9" fill="#2f3437"/>
<line x1="570" y1="100" x2="570" y2="440" stroke="#555c61" stroke-width="3"/><line x1="570" y1="440" x2="950" y2="440" stroke="#555c61" stroke-width="3"/>
<text x="556" y="114" font-size="26" fill="#555c61" text-anchor="end">P</text><text x="950" y="474" font-size="26" fill="#555c61" text-anchor="end">Y</text>
<text x="760.0" y="70" font-size="32" font-weight="700" fill="#2f3437" text-anchor="middle">Medium run</text>
<text x="760.0" y="520" font-size="25" fill="#555c61" text-anchor="middle">AD and AS set output</text>
