<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solow Growth Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<!-- One line that makes this file work inside slides: light/dark sync and slide keys -->
<script src="../../../../../assets/interactive.js"></script>
<style>
  /* Model (per effective worker):  y = k^θ
     Δk = s·y − (n + d + g)·k        Steady state:  k* = (s / (n + d + g))^(1 / (1 − θ))
     Golden rule: MPK = n + d + g  ⇔  s = θ                                                    */
  :root {
    --bg: #ffffff; --ink: #494e52; --heading: #313436; --muted: #5f676d; --line: #e5e7e8;
    --accent: #2f6f83; --accent-bright: #52adc8; --red: #c0504d; --gold: #b5852a;
    --ghost: #bcc0c3; --soft: #eaf5f8;
    --f-ui: "Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  :root.dark-mode {
    --bg: #1e1e1e; --ink: #d1d5db; --heading: #f3f4f6; --muted: #9ca3af; --line: #2a2a2a;
    --accent: #7dd3fc; --accent-bright: #60a5fa; --red: #f87171; --gold: #fbbf24;
    --ghost: #4b5563; --soft: #1f2a36; color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light-mode) {
      --bg: #1e1e1e; --ink: #d1d5db; --heading: #f3f4f6; --muted: #9ca3af; --line: #2a2a2a;
      --accent: #7dd3fc; --accent-bright: #60a5fa; --red: #f87171; --gold: #fbbf24;
      --ghost: #4b5563; --soft: #1f2a36; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px;
    padding: 14px 22px; background: var(--bg); color: var(--ink); font: 17px/1.35 var(--f-ui);
  }
  .panel { display: flex; flex-direction: column; gap: 7px; min-width: 0; overflow: auto; }
  .ctl label { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; color: var(--heading); }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent-bright); height: 20px; margin: 0; }
  .read {
    display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0;
    padding-top: 7px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .read dt { color: var(--muted); }
  .read dd { margin: 0; font-weight: 700; color: var(--heading); }
  .read dd span { font-weight: 400; color: var(--muted); font-size: 0.85em; margin-left: 6px; }
  .hint { margin: 0; padding: 7px 10px; background: var(--soft); border-radius: 4px; font-size: 0.82em; line-height: 1.3; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.92em; font-weight: 600; padding: 5px 11px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 6px; }
  .eq { text-align: center; color: var(--heading); font-weight: 600; }
  .chart { flex: 1; min-height: 0; display: flex; }
  svg { width: 100%; height: 100%; min-height: 260px; }
  .axis { stroke: var(--muted); stroke-width: 2; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .ghost { stroke: var(--ghost); stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; }
  .fk { stroke: var(--heading); stroke-width: 3.5; fill: none; }
  .sfk { stroke: var(--accent-bright); stroke-width: 4; fill: none; }
  .brk { stroke: var(--red); stroke-width: 3.5; fill: none; }
  .path { stroke: var(--accent-bright); stroke-width: 4; fill: none; }
  .gold { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 4 5; }
  .guide { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
  .cons { stroke: var(--gold); stroke-width: 6; }
  .pt { fill: var(--accent-bright); stroke: var(--bg); stroke-width: 3; }
  .pt0 { fill: var(--ghost); }
  .tick { fill: var(--muted); font: 14px var(--f-ui); }
  .ttl { fill: var(--muted); font: 15px var(--f-ui); }
  .key { fill: var(--heading); font: 600 15px var(--f-ui); }
  .lbl { font: 700 15px var(--f-ui); }
  [hidden] { display: none !important; }
  @media (max-height: 470px) { body { font-size: 15px; padding: 8px 14px; gap: 18px; } .panel { gap: 3px; } .read { gap: 1px 10px; padding-top: 4px; } .main { gap: 4px; } .eq { font-size: 0.9em; } }
  @media (max-width: 860px) { body { grid-template-columns: 240px minmax(0, 1fr); gap: 14px; padding: 12px 14px; font-size: 15px; } }
  @media (max-width: 560px) { body { grid-template-columns: 1fr; height: auto; } svg { height: 320px; } }
</style>
</head>
<body>
  <div class="panel">
    <div class="ctl">
      <label for="s">Saving rate, s <output id="s-out" for="s"></output></label>
      <input id="s" type="range" min="0.10" max="0.50" step="0.01" value="0.25">
    </div>
    <div class="ctl">
      <label for="n">Population growth, n <output id="n-out" for="n"></output></label>
      <input id="n" type="range" min="0" max="0.03" step="0.0025" value="0.01">
    </div>
    <div class="ctl">
      <label for="d">Depreciation, d <output id="d-out" for="d"></output></label>
      <input id="d" type="range" min="0.03" max="0.10" step="0.005" value="0.05">
    </div>
    <div class="ctl">
      <label for="g">Technology growth, g <output id="g-out" for="g"></output></label>
      <input id="g" type="range" min="0" max="0.03" step="0.0025" value="0.02">
    </div>
    <div class="ctl">
      <label for="t">Capital share, θ <output id="t-out" for="t"></output></label>
      <input id="t" type="range" min="0.25" max="0.50" step="0.01" value="0.33">
    </div>
    <dl class="read">
      <dt>Capital, k*</dt><dd id="k-read"></dd>
      <dt>Output, y*</dt><dd id="y-read"></dd>
      <dt>Consumption, c*</dt><dd id="c-read"></dd>
      <dt>Golden-rule s</dt><dd id="gr-read"></dd>
    </dl>
  </div>

  <div class="main">
    <div class="row" role="group" aria-label="View">
      <button id="v-ss" type="button" aria-pressed="true">Steady state</button>
      <button id="v-tp" type="button" aria-pressed="false">Time path</button>
      <button id="golden" type="button">Golden rule</button>
      <button id="reset" type="button">Reset</button>
      <span class="eq" id="eq" style="margin-left:auto">Δk = s·f(k) − (n + d + g)·k</span>
    </div>
    <div class="chart">
      <svg id="ss" viewBox="0 0 660 430" role="img" aria-label="Solow steady-state diagram">
        <defs><clipPath id="plot"><rect x="60" y="30" width="580" height="350"></rect></clipPath></defs>
        <g id="ss-grid"></g>
        <line class="axis" x1="60" y1="30" x2="60" y2="380"></line>
        <line class="axis" x1="60" y1="380" x2="640" y2="380"></line>
        <text class="ttl" x="640" y="418" text-anchor="end">Capital per effective worker, k</text>
        <text class="ttl" x="8" y="18">Output and investment per effective worker</text>
        <g clip-path="url(#plot)">
          <polyline id="f0" class="ghost"></polyline>
          <polyline id="s0" class="ghost"></polyline>
          <polyline id="b0" class="ghost"></polyline>
          <line id="kgold" class="gold"></line>
          <line id="gk" class="guide"></line>
          <line id="cbar" class="cons"></line>
          <polyline id="f" class="fk"></polyline>
          <polyline id="sf" class="sfk"></polyline>
          <polyline id="b" class="brk"></polyline>
          <circle id="p0" class="pt0" r="6"></circle>
          <circle id="p" class="pt" r="8"></circle>
          <circle id="py" class="pt" r="6"></circle>
          <text id="lf" class="lbl" fill="var(--heading)">f(k)</text>
          <text id="ls" class="lbl" fill="var(--accent-bright)">s·f(k)</text>
          <text id="lb" class="lbl" fill="var(--red)">(n+d+g)k</text>
          <text id="lc" class="lbl" fill="var(--gold)">c*</text>
          <text id="lk" class="tick" text-anchor="middle">k*</text>
          <text id="lg" class="tick" text-anchor="middle" fill="var(--gold)">k gold</text>
        </g>
      </svg>
      <svg id="tp" viewBox="0 0 660 430" role="img" aria-label="Time path of output per worker" style="display:none">
        <defs><clipPath id="plot2"><rect x="60" y="30" width="580" height="350"></rect></clipPath></defs>
        <g id="tp-grid"></g>
        <line class="axis" x1="60" y1="30" x2="60" y2="380"></line>
        <line class="axis" x1="60" y1="380" x2="640" y2="380"></line>
        <text class="ttl" x="640" y="418" text-anchor="end">Years after the change</text>
        <text class="ttl" x="8" y="18">Output per worker, Y/L (start = 100, log scale)</text>
        <g clip-path="url(#plot2)">
          <polyline id="tp0" class="ghost"></polyline>
          <polyline id="tp1" class="path"></polyline>
        </g>
        <g transform="translate(80 52)">
          <line class="path" x1="0" y1="0" x2="28" y2="0"></line><text class="key" x="36" y="5">New parameters</text>
          <line class="ghost" x1="170" y1="0" x2="198" y2="0"></line><text class="key" x="206" y="5">No change</text>
        </g>
      </svg>
    </div>
    <p class="hint" id="hint"></p>
  </div>

<script>
(function () {
  var BASE = { s: 0.25, n: 0.01, d: 0.05, g: 0.02, t: 0.33 };
  var $ = function (id) { return document.getElementById(id); };
  var ids = ["s", "n", "d", "g", "t"];
  var view = "ss";

  function get() { var p = {}; ids.forEach(function (k) { p[k] = +$(k).value; }); return p; }
  function kstar(p) { return Math.pow(p.s / (p.n + p.d + p.g), 1 / (1 - p.t)); }
  function f(k, p) { return Math.pow(k, p.t); }
  function pct(x, dp) { return (x * 100).toFixed(dp === undefined ? 1 : dp) + "%"; }
  function signed(v, dp) { var s = v.toFixed(dp); return (v > 0.00001 ? "+" : "") + s; }

  var X0 = 60, X1 = 640, Y0 = 380, Y1 = 30;
  var KMAX, YMAX;
  var sx = function (k) { return X0 + k / KMAX * (X1 - X0); };
  var sy = function (v) { return Y0 - v / YMAX * (Y0 - Y1); };

  function curve(fn, p) {
    var pts = [], N = 140;
    for (var i = 0; i <= N; i++) { var k = KMAX * i / N; pts.push(sx(k).toFixed(1) + "," + sy(fn(k, p)).toFixed(1)); }
    return pts.join(" ");
  }
  function nice(m) { var e = Math.pow(10, Math.floor(Math.log10(m))), r = m / e; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * e; }

  function grid(id, xs, ys, fx, fy, labx, laby) {
    var h = "";
    xs.forEach(function (x) { h += '<line class="grid" x1="' + fx(x) + '" y1="30" x2="' + fx(x) + '" y2="380"></line><text class="tick" x="' + fx(x) + '" y="398" text-anchor="middle">' + labx(x) + "</text>"; });
    ys.forEach(function (y) { h += '<line class="grid" x1="60" y1="' + fy(y) + '" x2="640" y2="' + fy(y) + '"></line><text class="tick" x="52" y="' + (fy(y) + 5) + '" text-anchor="end">' + laby(y) + "</text>"; });
    $(id).innerHTML = h;
  }
  function setLine(id, x1, y1, x2, y2) { var e = $(id); e.setAttribute("x1", x1); e.setAttribute("y1", y1); e.setAttribute("x2", x2); e.setAttribute("y2", y2); }
  function setPt(id, x, y) { $(id).setAttribute("cx", x); $(id).setAttribute("cy", y); }
  function setTxt(id, x, y) { $(id).setAttribute("x", x); $(id).setAttribute("y", y); }

  function drawSS(p, k1, k0) {
    var b = BASE;
    KMAX = nice(Math.max(k1, k0) * 1.55);
    var ytop = Math.pow(KMAX, Math.max(p.t, b.t)) * 1.06;
    var ystep = nice(ytop / 4) / (nice(ytop / 4) > ytop / 2.5 ? 2 : 1);
    YMAX = ytop;
    var step = KMAX / 5, yt = [];
    for (var v = ystep; v < ytop; v += ystep) yt.push(v);
    grid("ss-grid", [1, 2, 3, 4, 5].map(function (i) { return i * step; }), yt,
      sx, sy, function (x) { return +x.toPrecision(3); }, function (y) { return +y.toPrecision(2); });

    $("f0").setAttribute("points", curve(f, b));
    $("s0").setAttribute("points", curve(function (k, q) { return q.s * f(k, q); }, b));
    $("b0").setAttribute("points", curve(function (k, q) { return (q.n + q.d + q.g) * k; }, b));
    $("f").setAttribute("points", curve(f, p));
    $("sf").setAttribute("points", curve(function (k, q) { return q.s * f(k, q); }, p));
    $("b").setAttribute("points", curve(function (k, q) { return (q.n + q.d + q.g) * k; }, p));

    var y1 = f(k1, p), i1 = p.s * y1;
    setPt("p0", sx(k0), sy(b.s * f(k0, b)));
    setPt("p", sx(k1), sy(i1));
    setPt("py", sx(k1), sy(y1));
    setLine("gk", sx(k1), sy(y1), sx(k1), Y0);
    setLine("cbar", sx(k1) + 7, sy(y1), sx(k1) + 7, sy(i1));
    setTxt("lc", sx(k1) + 14, (sy(y1) + sy(i1)) / 2 + 5);
    setTxt("lk", sx(k1), Y0 - 6);

    var kg = Math.pow(p.t / (p.n + p.d + p.g), 1 / (1 - p.t));
    var showG = kg < KMAX;
    $("kgold").style.display = $("lg").style.display = showG ? "" : "none";
    setLine("kgold", sx(kg), Y1, sx(kg), Y0);
    setTxt("lg", sx(kg), Y1 + 18);

    var kl = KMAX * 0.97;
    setTxt("lf", sx(kl) - 4, sy(f(kl, p)) - 10); $("lf").setAttribute("text-anchor", "end");
    setTxt("ls", sx(kl) - 4, sy(p.s * f(kl, p)) + 22); $("ls").setAttribute("text-anchor", "end");
    var kb = Math.min(KMAX * 0.97, YMAX * 0.92 / (p.n + p.d + p.g));
    setTxt("lb", sx(kb) - 8, sy((p.n + p.d + p.g) * kb) - 8); $("lb").setAttribute("text-anchor", "end");
  }

  function path(p, kStart, T) {
    var k = kStart, A = 1, out = [];
    var y0 = f(kStart, BASE);
    for (var t = 0; t <= T; t++) {
      out.push(100 * A * f(k, p) / y0);
      k = k + p.s * f(k, p) - (p.n + p.d + p.g) * k;
      A = A * (1 + p.g);
    }
    return out;
  }

  function drawTP(p, k0) {
    var T = 80;
    var a = path(p, k0, T), z = path(BASE, k0, T);
    var lo = Math.min.apply(null, a.concat(z)), hi = Math.max.apply(null, a.concat(z));
    var L0 = Math.log(Math.min(lo, 100) * 0.95), L1 = Math.log(hi * 1.05);
    var tx = function (t) { return X0 + t / T * (X1 - X0); };
    var ty = function (v) { return Y0 - (Math.log(v) - L0) / (L1 - L0) * (Y0 - Y1); };
    var ticks = [], v = 50;
    while (v < hi * 1.05) { if (v >= Math.exp(L0)) ticks.push(v); v = v < 100 ? 100 : v * 2; }
    grid("tp-grid", [20, 40, 60, 80], ticks, tx, ty, function (x) { return x; }, function (y) { return Math.round(y); });
    var pts = function (arr) { return arr.map(function (v, t) { return tx(t).toFixed(1) + "," + ty(v).toFixed(1); }).join(" "); };
    $("tp0").setAttribute("points", pts(z));
    $("tp1").setAttribute("points", pts(a));
  }

  function draw() {
    var p = get(), b = BASE;
    $("s-out").textContent = pct(p.s, 0);
    $("n-out").textContent = pct(p.n, 2);
    $("d-out").textContent = pct(p.d, 1);
    $("g-out").textContent = pct(p.g, 2);
    $("t-out").textContent = p.t.toFixed(2);

    var k0 = kstar(b), k1 = kstar(p);
    var y0 = f(k0, b), y1 = f(k1, p), c0 = (1 - b.s) * y0, c1 = (1 - p.s) * y1;
    var moved = ids.some(function (k) { return Math.abs(p[k] - b[k]) > 1e-9; });
    var tag = function (v1, v0) { return moved ? "<span>" + signed((v1 / v0 - 1) * 100, 0) + "%</span>" : ""; };
    $("k-read").innerHTML = k1.toFixed(2) + tag(k1, k0);
    $("y-read").innerHTML = y1.toFixed(2) + tag(y1, y0);
    $("c-read").innerHTML = c1.toFixed(2) + tag(c1, c0);
    $("gr-read").innerHTML = pct(p.t, 0) + "<span>(s = θ)</span>";

    drawSS(p, k1, k0);
    drawTP(p, k0);

    var msg;
    if (!moved) {
      msg = "Move a slider. Grey dashed curves show the start. In steady state, Y/L grows at g = " + pct(p.g, 1) + " a year.";
    } else {
      var parts = [];
      if (p.s !== b.s) parts.push(p.s > b.s ? "Higher saving raises k* and y*." : "Lower saving cuts k* and y*.");
      if (p.n !== b.n) parts.push(p.n > b.n ? "Higher n steepens the break-even line: k* falls." : "Lower n raises k*.");
      if (p.d !== b.d) parts.push(p.d > b.d ? "Faster depreciation lowers k*." : "Slower depreciation raises k*.");
      if (p.g !== b.g) parts.push("Y/L now grows at g = " + pct(p.g, 1) + " a year in the long run.");
      if (p.t !== b.t) parts.push("Higher θ: returns to capital diminish more slowly.");
      var gap = p.s - p.t;
      if (Math.abs(gap) < 0.005) parts.push("Golden rule: c* is at its maximum.");
      else parts.push(gap < 0 ? "s < θ: more saving would raise c*." : "s > θ: saving too much; c* would rise if s fell.");
      msg = parts.join(" ");
    }
    $("hint").textContent = msg;
  }

  function setView(v) {
    view = v;
    $("ss").style.display = v === "ss" ? "" : "none"; $("tp").style.display = v === "tp" ? "" : "none";
    $("v-ss").setAttribute("aria-pressed", v === "ss"); $("v-tp").setAttribute("aria-pressed", v === "tp");
    $("eq").textContent = v === "ss" ? "Δk = s·f(k) − (n + d + g)·k" : "Parameters change at year 0";
  }

  ids.forEach(function (k) { $(k).addEventListener("input", draw); });
  $("reset").addEventListener("click", function () { ids.forEach(function (k) { $(k).value = BASE[k]; }); draw(); });
  $("golden").addEventListener("click", function () { $("s").value = (+$("t").value).toFixed(2); draw(); });
  $("v-ss").addEventListener("click", function () { setView("ss"); });
  $("v-tp").addEventListener("click", function () { setView("tp"); });
  window.addEventListener("themechange", draw);
  draw();
})();
</script>
</body>
</html>
