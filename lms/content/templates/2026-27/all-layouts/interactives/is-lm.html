<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IS-LM Interactive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<!-- One line that makes this file work inside slides: light/dark sync and slide keys -->
<script src="../../../../../assets/interactive.js"></script>
<style>
  /* Model:  IS  Y = 600 + 2G - 30r      LM  M = 0.5Y - 20r
     Solved: r* = (300 + G - M) / 35     Y* = 600 + 2G - 30r* */
  :root {
    --bg: #ffffff; --ink: #494e52; --heading: #313436; --muted: #7a8288; --line: #e5e7e8;
    --accent: #3d8296; --accent-bright: #52adc8; --ghost: #bcc0c3; --soft: #eaf5f8;
    --f-ui: "Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  :root.dark-mode {
    --bg: #1e1e1e; --ink: #d1d5db; --heading: #f3f4f6; --muted: #9ca3af; --line: #2a2a2a;
    --accent: #7dd3fc; --accent-bright: #60a5fa; --ghost: #4b5563; --soft: #1f2a36; color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light-mode) {
      --bg: #1e1e1e; --ink: #d1d5db; --heading: #f3f4f6; --muted: #9ca3af; --line: #2a2a2a;
      --accent: #7dd3fc; --accent-bright: #60a5fa; --ghost: #4b5563; --soft: #1f2a36; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px;
    padding: 18px 24px; background: var(--bg); color: var(--ink); font: 18px/1.4 var(--f-ui);
  }
  .panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .ctl label { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; color: var(--heading); margin-bottom: 4px; }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .ctl small { display: block; color: var(--muted); font-size: 0.8em; }
  input[type="range"] { width: 100%; accent-color: var(--accent-bright); height: 26px; margin: 0; }
  .read {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0;
    padding-top: 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .read dt { color: var(--muted); }
  .read dd { margin: 0; font-weight: 700; color: var(--heading); }
  .read dd span { font-weight: 400; color: var(--muted); font-size: 0.85em; margin-left: 6px; }
  .hint { margin: 0; padding: 10px 12px; background: var(--soft); border-radius: 4px; font-size: 0.9em; min-height: 3.2em; }
  button {
    align-self: flex-start; font: inherit; font-weight: 600; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chart { min-width: 0; min-height: 0; display: flex; }
  svg { width: 100%; height: 100%; min-height: 260px; }
  .axis { stroke: var(--muted); stroke-width: 2; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .ghost { stroke: var(--ghost); stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; }
  .is { stroke: var(--heading); stroke-width: 4; fill: none; }
  .lm { stroke: var(--accent-bright); stroke-width: 4; fill: none; }
  .guide { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
  .pt { fill: var(--accent-bright); stroke: var(--bg); stroke-width: 3; }
  .pt0 { fill: var(--ghost); }
  .tick { fill: var(--muted); font: 14px var(--f-ui); }
  .ttl { fill: var(--muted); font: 15px var(--f-ui); }
  .key { fill: var(--heading); font: 600 15px var(--f-ui); }
  @media (max-width: 860px) { body { grid-template-columns: 250px minmax(0, 1fr); gap: 16px; padding: 14px 16px; font-size: 16px; } }
  @media (max-width: 560px) { body { grid-template-columns: 1fr; height: auto; } svg { height: 320px; } }
</style>
</head>
<body>
  <div class="panel">
    <div class="ctl">
      <label for="g">Government spending, G <output id="g-out" for="g">150</output></label>
      <input id="g" type="range" min="100" max="250" step="10" value="150">
      <small>Fiscal policy shifts the IS curve</small>
    </div>
    <div class="ctl">
      <label for="m">Money supply, M <output id="m-out" for="m">350</output></label>
      <input id="m" type="range" min="250" max="400" step="10" value="350">
      <small>Monetary policy shifts the LM curve</small>
    </div>
    <dl class="read">
      <dt>Income, Y*</dt><dd id="y-read"></dd>
      <dt>Interest rate, r*</dt><dd id="r-read"></dd>
    </dl>
    <p class="hint" id="hint"></p>
    <button id="reset" type="button">Reset</button>
  </div>

  <div class="chart">
    <svg viewBox="0 0 640 440" role="img" aria-label="IS-LM diagram">
      <defs><clipPath id="plot"><rect x="70" y="20" width="550" height="370"></rect></clipPath></defs>
      <g id="grid"></g>
      <line class="axis" x1="70" y1="20" x2="70" y2="390"></line>
      <line class="axis" x1="70" y1="390" x2="620" y2="390"></line>
      <text class="ttl" x="620" y="428" text-anchor="end">Income, Y</text>
      <text class="ttl" x="12" y="14">Interest rate, r (%)</text>
      <g clip-path="url(#plot)">
        <polyline id="is0" class="ghost"></polyline>
        <polyline id="lm0" class="ghost"></polyline>
        <line id="gx" class="guide"></line>
        <line id="gy" class="guide"></line>
        <polyline id="is" class="is"></polyline>
        <polyline id="lm" class="lm"></polyline>
        <circle id="p0" class="pt0" r="6"></circle>
        <circle id="p" class="pt" r="9"></circle>
      </g>
      <g transform="translate(400 10)">
        <line class="is" x1="0" y1="0" x2="28" y2="0"></line><text class="key" x="36" y="5">IS</text>
        <line class="lm" x1="72" y1="0" x2="100" y2="0"></line><text class="key" x="108" y="5">LM</text>
        <line class="ghost" x1="150" y1="0" x2="178" y2="0"></line><text class="key" x="186" y="5">Start</text>
      </g>
    </svg>
  </div>

<script>
(function () {
  var G0 = 150, M0 = 350;
  var Y_MIN = 500, Y_MAX = 1200, R_MAX = 12;
  var $ = function (id) { return document.getElementById(id); };
  var sx = function (y) { return 70 + (y - Y_MIN) / (Y_MAX - Y_MIN) * 550; };
  var sy = function (r) { return 390 - r / R_MAX * 370; };

  function isR(Y, G) { return (600 + 2 * G - Y) / 30; }
  function lmR(Y, M) { return (0.5 * Y - M) / 20; }
  function eq(G, M) { var r = (300 + G - M) / 35; return { r: r, Y: 600 + 2 * G - 30 * r }; }
  function line(fn, k) { return [Y_MIN, Y_MAX].map(function (Y) { return sx(Y) + "," + sy(fn(Y, k)); }).join(" "); }

  // Grid and tick labels
  var grid = "";
  [600, 800, 1000, 1200].forEach(function (Y) {
    grid += '<line class="grid" x1="' + sx(Y) + '" y1="20" x2="' + sx(Y) + '" y2="390"></line>' +
            '<text class="tick" x="' + sx(Y) + '" y="410" text-anchor="middle">' + Y + '</text>';
  });
  [0, 4, 8, 12].forEach(function (r) {
    grid += '<line class="grid" x1="70" y1="' + sy(r) + '" x2="620" y2="' + sy(r) + '"></line>' +
            '<text class="tick" x="60" y="' + (sy(r) + 5) + '" text-anchor="end">' + r + '</text>';
  });
  $("grid").innerHTML = grid;

  var e0 = eq(G0, M0);
  $("is0").setAttribute("points", line(isR, G0));
  $("lm0").setAttribute("points", line(lmR, M0));
  $("p0").setAttribute("cx", sx(e0.Y)); $("p0").setAttribute("cy", sy(e0.r));

  function signed(v, d) { var s = v.toFixed(d); return (v > 0.0001 ? "+" : "") + s; }
  function word(v, up, down) { return Math.abs(v) < 0.05 ? "stays the same" : (v > 0 ? up : down); }

  function draw() {
    var G = +$("g").value, M = +$("m").value, e = eq(G, M);
    $("g-out").textContent = G; $("m-out").textContent = M;
    $("is").setAttribute("points", line(isR, G));
    $("lm").setAttribute("points", line(lmR, M));
    $("p").setAttribute("cx", sx(e.Y)); $("p").setAttribute("cy", sy(e.r));
    $("gx").setAttribute("x1", sx(e.Y)); $("gx").setAttribute("x2", sx(e.Y));
    $("gx").setAttribute("y1", sy(e.r)); $("gx").setAttribute("y2", 390);
    $("gy").setAttribute("x1", 70); $("gy").setAttribute("x2", sx(e.Y));
    $("gy").setAttribute("y1", sy(e.r)); $("gy").setAttribute("y2", sy(e.r));

    var dY = e.Y - e0.Y, dr = e.r - e0.r;
    var moved = G !== G0 || M !== M0;
    $("y-read").innerHTML = Math.round(e.Y) + (moved ? "<span>" + signed(dY, 0) + "</span>" : "");
    $("r-read").innerHTML = e.r.toFixed(1) + "%" + (moved ? "<span>" + signed(dr, 1) + "</span>" : "");

    var parts = [];
    if (G !== G0) parts.push(G > G0 ? "Higher G shifts IS right." : "Lower G shifts IS left.");
    if (M !== M0) parts.push(M > M0 ? "More money shifts LM right." : "Less money shifts LM left.");
    $("hint").textContent = moved
      ? parts.join(" ") + " Income " + word(dY, "rises", "falls") + "; the interest rate " + word(dr, "rises", "falls") + "."
      : "Move a slider. Dashed lines show the starting position.";
  }

  $("g").addEventListener("input", draw);
  $("m").addEventListener("input", draw);
  $("reset").addEventListener("click", function () { $("g").value = G0; $("m").value = M0; draw(); });
  draw();
})();
</script>
</body>
</html>
